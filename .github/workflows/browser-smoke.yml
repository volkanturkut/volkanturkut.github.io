name: Browser and low-end performance smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install --no-save playwright pngjs
          npx playwright install chromium

      - name: Serve the checked-out website
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --directory . >/tmp/entangled-http.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              echo "Local website server is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/entangled-http.log
          exit 1

      - name: Test desktop, phone, tablet, large screens and WebGL fallback
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          BASE_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          import { PNG } from 'pngjs';

          function countNonBackgroundPixels(png) {
            const bg = [png.data[0], png.data[1], png.data[2]];
            let count = 0;
            const artHeight = Math.max(1, png.height - 120);
            for (let y = 0; y < artHeight; y++) {
              for (let x = 0; x < png.width; x++) {
                const i = (y * png.width + x) * 4;
                const distance = Math.abs(png.data[i] - bg[0]) +
                  Math.abs(png.data[i + 1] - bg[1]) +
                  Math.abs(png.data[i + 2] - bg[2]);
                if (distance > 45) count++;
              }
            }
            return count;
          }

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-gl=angle',
              '--use-angle=swiftshader',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--enable-unsafe-swiftshader',
            ],
          });

          async function openCurrentDeployment(page, pageErrors, failedRuntimeRequests, label, requirePerformanceProfile = true) {
            pageErrors.length = 0;
            failedRuntimeRequests.length = 0;
            const response = await page.goto(process.env.BASE_URL, {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            assert.equal(response?.status(), 200, `${label}: local site must return HTTP 200`);
            const activeBuild = await page.evaluate(() => window.__ENTANGLED_PERF__?.build === 'low-end-r12');
            if (requirePerformanceProfile) {
              assert.ok(activeBuild, `${label}: expected low-end-r12 performance profile from checked-out commit`);
            }
            console.log(`${label}: ${requirePerformanceProfile ? 'running checked-out performance profile from' : 'checking lightweight fallback shell on'} ${process.env.EXPECTED_REVISION}`);
            return response;
          }

          const scenarios = [
            { name: 'desktop', viewport: { width: 1280, height: 800 }, deviceScaleFactor: 1, hardwareConcurrency: 8, deviceMemory: 8 },
            { name: 'iphone-like', viewport: { width: 390, height: 844 }, deviceScaleFactor: 3, isMobile: true, hasTouch: true, hardwareConcurrency: 4, deviceMemory: 4 },
            { name: 'small-android-like', viewport: { width: 360, height: 800 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, hardwareConcurrency: 4, deviceMemory: 4 },
            { name: 'tablet', viewport: { width: 768, height: 1024 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, hardwareConcurrency: 8, deviceMemory: 8 },
            { name: 'reduced-motion', viewport: { width: 1280, height: 800 }, deviceScaleFactor: 1, hardwareConcurrency: 8, deviceMemory: 8, reducedMotion: 'reduce' },
            { name: 'large-monitor', viewport: { width: 2560, height: 1440 }, deviceScaleFactor: 1.5, hardwareConcurrency: 8, deviceMemory: 8 },
          ];

          const reports = [];
          try {
            for (const scenario of scenarios) {
              const userAgent = scenario.name === 'iphone-like'
                ? 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
                : scenario.name === 'small-android-like'
                  ? 'Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Mobile Safari/537.36'
                  : scenario.name === 'tablet'
                    ? 'Mozilla/5.0 (iPad; CPU OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1'
                    : 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36';
              const context = await browser.newContext({
                viewport: scenario.viewport,
                deviceScaleFactor: scenario.deviceScaleFactor,
                isMobile: Boolean(scenario.isMobile),
                hasTouch: Boolean(scenario.hasTouch),
                reducedMotion: scenario.reducedMotion || 'no-preference',
                userAgent,
              });
              await context.addInitScript((hardware) => {
                try { localStorage.clear(); } catch (_) {}
                Object.defineProperty(navigator, 'hardwareConcurrency', {
                  configurable: true,
                  get: () => hardware.cores,
                });
                if (hardware.memory !== null) {
                  Object.defineProperty(navigator, 'deviceMemory', {
                    configurable: true,
                    get: () => hardware.memory,
                  });
                }
              }, { cores: scenario.hardwareConcurrency, memory: scenario.deviceMemory });

              const page = await context.newPage();
              const cacheSession = await context.newCDPSession(page);
              await cacheSession.send('Network.setCacheDisabled', { cacheDisabled: true });
              const pageErrors = [];
              const failedRuntimeRequests = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));
              const isRuntimeAsset = (url) =>
                ['/app.js', '/performance.js', '/styles.css', '/bundle.min.js', '/fxhash.min.js', '/three.r157.min.js']
                  .some((suffix) => new URL(url).pathname.endsWith(suffix));

              page.on('requestfailed', (request) => {
                if (new URL(request.url()).origin === process.env.BASE_URL && isRuntimeAsset(request.url())) {
                  failedRuntimeRequests.push({ url: request.url(), error: request.failure()?.errorText });
                }
              });
              page.on('response', (response) => {
                if (new URL(response.url()).origin === process.env.BASE_URL &&
                    isRuntimeAsset(response.url()) && response.status() >= 400) {
                  failedRuntimeRequests.push({ url: response.url(), status: response.status() });
                }
              });

              const response = await openCurrentDeployment(page, pageErrors, failedRuntimeRequests, scenario.name);
              assert.equal(response?.status(), 200, `${scenario.name}: home page must return HTTP 200`);
              await page.waitForFunction(() => {
                const canvas = document.querySelector('canvas#scene');
                return (canvas && canvas.width > 0 && canvas.height > 0) ||
                  document.documentElement.classList.contains('no-webgl');
              }, null, { timeout: 45000 });
              await page.waitForTimeout(4500);

              const beforeFrames = await page.evaluate(() => window.__ENTANGLED_PERF__?.frameCount ?? 0);
              await page.waitForTimeout(1200);

              const state = await page.evaluate(() => {
                const canvas = document.querySelector('canvas#scene');
                const profile = window.__ENTANGLED_PERF__;
                return {
                  title: document.title,
                  viewport: { width: window.innerWidth, height: window.innerHeight },
                  documentSize: {
                    width: document.documentElement.scrollWidth,
                    height: document.documentElement.scrollHeight,
                    clientWidth: document.documentElement.clientWidth,
                    clientHeight: document.documentElement.clientHeight,
                  },
                  dpr: window.__ENTANGLED_RENDER_SCALE__ || window.devicePixelRatio,
                  canvas: canvas ? {
                    width: canvas.width,
                    height: canvas.height,
                    cssWidth: canvas.getBoundingClientRect().width,
                    cssHeight: canvas.getBoundingClientRect().height,
                  } : null,
                  profile: profile ? {
                    build: profile.build,
                    particleCount: profile.particleCount,
                    hardwareClass: profile.hardwareClass,
                    lowResource: profile.lowResource,
                    maxDevicePixelRatio: profile.maxDevicePixelRatio,
                    renderPixelBudget: profile.renderPixelBudget,
                    renderScale: profile.renderScale,
                    targetFramesPerSecond: profile.targetFramesPerSecond,
                    multiWindow: profile.multiWindow,
                    pointerControls: profile.pointerControls,
                    keyboardShortcuts: profile.keyboardShortcuts,
                    frameCount: profile.frameCount,
                  reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
                  } : null,
                  windowsStorage: localStorage.getItem('windows'),
                  noWebGLFallback: document.documentElement.classList.contains('no-webgl'),
                  rendererLoadError: window.__ENTANGLED_LOAD_ERROR__ || null,
                  links: [...document.querySelectorAll('.links a')].map((a) => ({
                    text: a.textContent.trim(),
                    href: a.href,
                  })),
                };
              });
              const afterFrames = state.profile?.frameCount ?? 0;
              const frameCountDelta = afterFrames - beforeFrames;
              if (scenario.name === 'desktop') {
                const screenshot = await page.screenshot({ path: '/tmp/entangled-desktop.png', fullPage: false, timeout: 60000 });
                const png = PNG.sync.read(screenshot);
                state.artworkNonBackgroundPixels = countNonBackgroundPixels(png);
                console.log('OPTIMIZED_VISUAL_PIXELS', state.artworkNonBackgroundPixels);

              }
              const runtimeState = {
                scenario: scenario.name,
                expectedRevision: process.env.EXPECTED_REVISION,
                ...state,
                framesDuring1200ms: frameCountDelta,
                pageErrors,
                failedRuntimeRequests,
              };
              reports.push(runtimeState);
              console.log('DEVICE_SMOKE', JSON.stringify(runtimeState, null, 2));
              if (scenario.name === 'desktop') {
                assert.ok(state.artworkNonBackgroundPixels > 100,
                  'optimized renderer must draw visible artwork, not only a black canvas');
              }

              assert.ok(state.documentSize.width <= state.documentSize.clientWidth + 1, `${scenario.name}: page should not introduce horizontal overflow`);
              assert.ok(state.documentSize.height <= state.documentSize.clientHeight + 1, `${scenario.name}: page should not introduce vertical overflow`);
              assert.ok(state.canvas, `${scenario.name}: WebGL canvas must exist; noWebGLFallback=${state.noWebGLFallback}, rendererLoadError=${state.rendererLoadError}, pageErrors=${JSON.stringify(pageErrors)}`);
              assert.equal(state.noWebGLFallback, false, `${scenario.name}: renderer fell back; rendererLoadError=${state.rendererLoadError}, pageErrors=${JSON.stringify(pageErrors)}`);
              assert.ok(state.canvas.width > 0 && state.canvas.height > 0, `${scenario.name}: canvas resolution must be positive`);
              assert.ok(state.profile, `${scenario.name}: performance profile must exist`);
              assert.equal(state.profile.build, 'low-end-r12');
              assert.ok(state.dpr > 0 && state.dpr <= state.profile.maxDevicePixelRatio, `${scenario.name}: effective DPR must respect the hardware cap, got ${state.dpr}`);
              assert.ok(state.canvas.width * state.canvas.height <= state.profile.renderPixelBudget + 10000,
                `${scenario.name}: render target exceeded pixel-area budget: ${state.canvas.width}x${state.canvas.height}`);
              assert.ok([16384, 32768].includes(state.profile.particleCount), `${scenario.name}: adaptive particle budget must be supported`);
              assert.equal(state.profile.particleCount, state.profile.hardwareClass === 'low' ? 16384 : 32768);
              assert.equal(state.profile.maxDevicePixelRatio, state.profile.hardwareClass === 'low' ? 1.0 : 1.25);
              assert.equal(state.profile.lowResource, state.profile.hardwareClass === 'low');
              assert.equal(state.profile.renderPixelBudget, 1000000);
              assert.ok(state.profile.renderScale > 0 && state.profile.renderScale <= 1.25);
              assert.equal(state.profile.targetFramesPerSecond, state.profile.reducedMotion ? 15 : state.profile.lowResource ? 24 : 30);
              assert.equal(state.profile.multiWindow, false);
              assert.equal(state.profile.pointerControls, false);
              assert.equal(state.profile.keyboardShortcuts, false);
              assert.ok(frameCountDelta <= Math.ceil(state.profile.targetFramesPerSecond * 1.2) + 3,
                `${scenario.name}: callback rate exceeded its configured cap, observed ${frameCountDelta}/1.2s`);
              assert.equal(state.windowsStorage, null, `${scenario.name}: window-sharing storage must not be initialized`);
              assert.equal(state.noWebGLFallback, false, `${scenario.name}: fallback should not be active on WebGL Chromium`);
              assert.deepEqual(state.links.map((link) => link.text), ['ArtStation', 'itch.io', 'GitHub']);
              assert.deepEqual(state.links.map((link) => link.href), [
                'https://volkanturkut.artstation.com/',
                'https://volkanturkut.itch.io/',
                'https://github.com/volkanturkut',
              ]);
              assert.deepEqual(pageErrors, [], `${scenario.name}: no uncaught JavaScript errors`);
              assert.deepEqual(failedRuntimeRequests, [], `${scenario.name}: runtime assets must load`);

              await context.close();
            }

            // Simulate a browser where neither WebGL API is exposed. Avoid importing the
            // heavy runtime and verify the low-cost CSS fallback instead.
            const fallbackContext = await browser.newContext({ viewport: { width: 800, height: 600 } });
            await fallbackContext.addInitScript(() => {
              Object.defineProperty(window, 'WebGLRenderingContext', { configurable: true, value: undefined });
              Object.defineProperty(window, 'WebGL2RenderingContext', { configurable: true, value: undefined });
            });
            const fallbackPage = await fallbackContext.newPage();
            const fallbackCacheSession = await fallbackContext.newCDPSession(fallbackPage);
            await fallbackCacheSession.send('Network.setCacheDisabled', { cacheDisabled: true });
            const heavyRuntimeRequests = [];
            fallbackPage.on('request', (request) => {
              const path = new URL(request.url()).pathname;
              if (['/performance.js', '/bundle.min.js', '/fxhash.min.js', '/three.r157.min.js'].includes(path)) {
                heavyRuntimeRequests.push(path);
              }
            });
            const fallbackErrors = [];
            fallbackPage.on('pageerror', (error) => fallbackErrors.push(error.message));
            const fallbackResponse = await openCurrentDeployment(fallbackPage, fallbackErrors, [], 'no-WebGL fallback', false);
            assert.equal(fallbackResponse?.status(), 200);
            await fallbackPage.waitForFunction(() => document.documentElement.classList.contains('no-webgl'));
            const fallbackState = await fallbackPage.evaluate(() => ({
              noWebGL: document.documentElement.classList.contains('no-webgl'),
              fallbackDisplay: getComputedStyle(document.querySelector('.fallback')).display,
              canvasCount: document.querySelectorAll('canvas#scene').length,
              profileBuild: window.__ENTANGLED_PERF__?.build,
              performanceModuleLoaded: Boolean(window.__ENTANGLED_PERF__),
            }));
            console.log('NO_WEBGL_FALLBACK', JSON.stringify({ ...fallbackState, heavyRuntimeRequests, fallbackErrors }, null, 2));
            assert.equal(fallbackState.noWebGL, true);
            assert.equal(fallbackState.fallbackDisplay, 'grid');
            assert.equal(fallbackState.canvasCount, 0);
            assert.equal(fallbackState.profileBuild, undefined, 'performance governor must not initialize without WebGL');
            assert.equal(fallbackState.performanceModuleLoaded, false);
            assert.deepEqual(heavyRuntimeRequests, [], 'performance governor and renderer dependencies must not load if WebGL APIs are absent');
            assert.deepEqual(fallbackErrors, [], 'no-WebGL fallback path should not throw JavaScript errors');
            await fallbackContext.close();

            // JavaScript-disabled browsers should still see the CSS fallback and
            // the portfolio links instead of a completely empty artwork area.
            const noJsContext = await browser.newContext({
              viewport: { width: 800, height: 600 },
              javaScriptEnabled: false,
            });
            const noJsPage = await noJsContext.newPage();
            const noJsResponse = await noJsPage.goto(process.env.BASE_URL, {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            assert.equal(noJsResponse?.status(), 200, 'JavaScript-disabled page must return HTTP 200');
            const noJsState = await noJsPage.locator('.fallback').evaluate((element) => ({
              display: getComputedStyle(element).display,
              canvasCount: document.querySelectorAll('canvas#scene').length,
              links: [...document.querySelectorAll('.links a')].map((a) => a.textContent.trim()),
            }));
            console.log('NO_JAVASCRIPT_FALLBACK', JSON.stringify(noJsState, null, 2));
            assert.equal(noJsState.display, 'grid', 'CSS fallback should be visible without JavaScript');
            assert.equal(noJsState.canvasCount, 0, 'renderer should not initialize without JavaScript');
            assert.deepEqual(noJsState.links, ['ArtStation', 'itch.io', 'GitHub']);
            await noJsContext.close();

            console.log('ALL_DEVICE_SMOKE_TESTS_PASSED', JSON.stringify(reports, null, 2));
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload desktop render screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: entangled-optimized-render
          path: /tmp/entangled-desktop.png
          if-no-files-found: ignore
