name: Browser and low-end performance smoke test

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  browser-smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Test desktop, phone, tablet, WebGL and performance limits
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-gl=angle',
              '--use-angle=swiftshader',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--enable-unsafe-swiftshader',
            ],
          });

          const scenarios = [
            { name: 'desktop', viewport: { width: 1280, height: 800 }, deviceScaleFactor: 1 },
            { name: 'phone', viewport: { width: 390, height: 844 }, deviceScaleFactor: 3, isMobile: true, hasTouch: true },
            { name: 'small-android', viewport: { width: 360, height: 800 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true },
            { name: 'tablet', viewport: { width: 768, height: 1024 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true },
          ];

          const reports = [];
          try {
            for (const scenario of scenarios) {
              const context = await browser.newContext({
                viewport: scenario.viewport,
                deviceScaleFactor: scenario.deviceScaleFactor,
                isMobile: Boolean(scenario.isMobile),
                hasTouch: Boolean(scenario.hasTouch),
              });
              await context.addInitScript(() => {
                try { localStorage.clear(); } catch (_) {}
              });

              const page = await context.newPage();
              const pageErrors = [];
              const failedRuntimeRequests = [];
              page.on('pageerror', (error) => pageErrors.push(error.message));
              const isRuntimeAsset = (url) =>
                ['/bundle.min.js', '/fxhash.min.js', '/three.r157.min.js']
                  .some((suffix) => new URL(url).pathname.endsWith(suffix));

              page.on('requestfailed', (request) => {
                if (request.url().startsWith('https://volkanturkut.github.io/') && isRuntimeAsset(request.url())) {
                  failedRuntimeRequests.push({ url: request.url(), error: request.failure()?.errorText });
                }
              });
              page.on('response', (response) => {
                if (response.url().startsWith('https://volkanturkut.github.io/') &&
                    isRuntimeAsset(response.url()) && response.status() >= 400) {
                  failedRuntimeRequests.push({ url: response.url(), status: response.status() });
                }
              });

              const response = await page.goto('https://volkanturkut.github.io/', {
                waitUntil: 'domcontentloaded',
                timeout: 90000,
              });
              assert.equal(response?.status(), 200, `${scenario.name}: home page must return HTTP 200`);
              await page.waitForSelector('canvas#scene', { state: 'attached', timeout: 45000 });
              await page.waitForFunction(() => {
                const canvas = document.querySelector('canvas#scene');
                return canvas && canvas.width > 0 && canvas.height > 0;
              }, null, { timeout: 45000 });
              await page.waitForTimeout(2200);

              const beforeFrames = await page.evaluate(() => window.__ENTANGLED_PERF__?.frameCount ?? 0);
              await page.waitForTimeout(1200);

              const state = await page.evaluate(() => {
                const canvas = document.querySelector('canvas#scene');
                const profile = window.__ENTANGLED_PERF__;
                return {
                  title: document.title,
                  viewport: { width: window.innerWidth, height: window.innerHeight },
                  dpr: window.devicePixelRatio,
                  canvas: canvas ? {
                    width: canvas.width,
                    height: canvas.height,
                    cssWidth: canvas.getBoundingClientRect().width,
                    cssHeight: canvas.getBoundingClientRect().height,
                  } : null,
                  profile: profile ? {
                    particleCount: profile.particleCount,
                    maxDevicePixelRatio: profile.maxDevicePixelRatio,
                    targetFramesPerSecond: profile.targetFramesPerSecond,
                    multiWindow: profile.multiWindow,
                    pointerControls: profile.pointerControls,
                    keyboardShortcuts: profile.keyboardShortcuts,
                    frameCount: profile.frameCount,
                  } : null,
                  windowsStorage: localStorage.getItem('windows'),
                  links: [...document.querySelectorAll('.links a')].map((a) => ({
                    text: a.textContent.trim(),
                    href: a.href,
                  })),
                };
              });
              const afterFrames = state.profile?.frameCount ?? 0;
              const frameCountDelta = afterFrames - beforeFrames;
              const runtimeState = {
                scenario: scenario.name,
                expectedRevision: process.env.EXPECTED_REVISION,
                ...state,
                framesDuring1200ms: frameCountDelta,
                pageErrors,
                failedRuntimeRequests,
              };
              reports.push(runtimeState);
              console.log('DEVICE_SMOKE', JSON.stringify(runtimeState, null, 2));

              assert.ok(state.canvas, `${scenario.name}: WebGL canvas must exist`);
              assert.ok(state.canvas.width > 0 && state.canvas.height > 0, `${scenario.name}: canvas resolution must be positive`);
              assert.ok(state.dpr <= 1.25, `${scenario.name}: DPR must be capped at 1.25, got ${state.dpr}`);
              assert.ok(state.canvas.width <= Math.ceil(scenario.viewport.width * 1.25) + 2,
                `${scenario.name}: canvas width exceeded capped pixel ratio: ${state.canvas.width}`);
              assert.deepEqual(state.profile, {
                particleCount: 262144,
                maxDevicePixelRatio: 1.25,
                targetFramesPerSecond: 30,
                multiWindow: false,
                pointerControls: false,
                keyboardShortcuts: false,
                frameCount: state.profile.frameCount,
              }, `${scenario.name}: expected low-end performance profile`);
              assert.ok(frameCountDelta >= 5 && frameCountDelta <= 42,
                `${scenario.name}: frame callbacks should be throttled near 30 FPS, observed ${frameCountDelta}/1.2s`);
              assert.equal(state.windowsStorage, null, `${scenario.name}: window-sharing storage must not be initialized`);
              assert.deepEqual(state.links.map((link) => link.text), ['ArtStation', 'itch.io', 'GitHub']);
              assert.deepEqual(state.links.map((link) => link.href), [
                'https://volkanturkut.artstation.com/',
                'https://volkanturkut.itch.io/',
                'https://github.com/volkanturkut',
              ]);
              assert.deepEqual(pageErrors, [], `${scenario.name}: no uncaught JavaScript errors`);
              assert.deepEqual(failedRuntimeRequests, [], `${scenario.name}: original runtime assets must load`);

              if (scenario.name === 'desktop') {
                await page.screenshot({ path: '/tmp/entangled-desktop.png', fullPage: true });
              }
              await context.close();
            }
            console.log('ALL_DEVICE_SMOKE_TESTS_PASSED', JSON.stringify(reports, null, 2));
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload desktop render screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entangled-desktop-render
          path: /tmp/entangled-desktop.png
          if-no-files-found: ignore
