name: Verify original Entangled source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-original-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify exact original file identities
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local file="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$file")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error file=$file::Git blob mismatch. expected=$expected actual=$actual"
              exit 1
            fi
            echo "PASS exact upstream blob: $file ($actual)"
          }

          # The preserved pristine upstream files stay byte-for-byte untouched.
          check_blob "original-source/versions/v0-original-entangled/bundle.min.js" "a554a6a3046692c50125decc6b094238598535f8"
          check_blob "original-source/versions/v0-original-entangled/fxhash.min.js" "8a91ebf2f97f6c30496aae43b90c01141a0de2df"
          check_blob "original-source/versions/v0-original-entangled/three.r157.min.js" "7a384bfb1b51375a18e6480b984e0834f5525d1c"
          check_blob "original-source/versions/v0-original-entangled/bundle.beautified.js" "f5d0cbd700c64d6aedf7094ab1fff06ef1a05cfe"
          check_blob "original-source/versions/v0-original-entangled/ITERATION_COLORS.txt" "04977253db54288e36a7a23240e6fe45c6343811"
          check_blob "original-source/versions/v0-original-entangled/index.html" "0a0da8986b2783f7e072309058284d09f797c0f7"
          check_blob "original-source/versions/v0-original-entangled/scheme_map.js" "2837db3d7a8116edce593f03ebbebb3888443c26"
          check_blob "original-source/versions/v0-original-entangled/scheme_slice.js" "62dd1f36186e55a11f8889000cda761ea9c05d55"

      - name: Check page wiring and remove obsolete renderer references
        shell: bash
        run: |
          set -euo pipefail
          node --check bundle.min.js
          node --input-type=module --check < app.js
          node --input-type=module --check < performance.js
          if grep -Fq '},;let ta=' bundle.min.js; then
            echo "::error file=bundle.min.js::Malformed removed-handler boundary detected"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';

          const html = readFileSync('index.html', 'utf8');
          const appSource = readFileSync('app.js', 'utf8');
          const performanceSource = readFileSync('performance.js', 'utf8');
          const stylesheet = readFileSync('styles.css', 'utf8');
          assert.ok(html.includes('href="./styles.css"'), 'page should load an external stylesheet');
          assert.ok(html.includes('src="./app.js"'), 'page should use the native ES module entry point');
          const originalScripts = [
            'await import("./three.r157.min.js")',
            'fxhash.src = "./fxhash.min.js"',
            'await import("./bundle.min.js")',
          ];
          const offsets = originalScripts.map((s) => appSource.indexOf(s));
          assert.ok(offsets.every((i) => i >= 0), 'all three original runtime scripts must be referenced');
          assert.ok(offsets[0] < offsets[1] && offsets[1] < offsets[2],
            'runtime must load in upstream order: Three.js, fxhash, Entangled bundle');

          for (const legacy of [
            'GPUComputationRenderer.js',
            'WindowManager.js',
            'computeShaders.js',
            'glslNoise.js',
            'glslUtils.js',
            'main.js',
            'materials.js',
          ]) {
            assert.ok(!html.includes(legacy), `index.html must not reference obsolete recreation file: ${legacy}`);
            assert.ok(!existsSync(legacy), `obsolete recreation file must be removed: ${legacy}`);
          }

          const localResources = [...html.matchAll(/(?:src|href)=["'](\.\/[^"']+)["']/g)].map((m) => m[1]);
          for (const resource of localResources) {
            const localPath = resource.slice(2).split(/[?#]/, 1)[0];
            assert.ok(existsSync(localPath), `missing local resource: ${resource}`);
          }

          const requiredPortfolioItems = [
            'Volkan Turkut',
            'https://volkanturkut.artstation.com/',
            'https://volkanturkut.itch.io/',
            'https://github.com/volkanturkut',
          ];
          for (const item of requiredPortfolioItems) {
            assert.ok(html.includes(item), `missing portfolio item: ${item}`);
          }

          assert.ok(!html.includes('favicon.svg'), 'custom non-original favicon should not be referenced');
          assert.ok(stylesheet.includes('html.no-webgl .fallback'), 'a low-cost fallback visual must be available without WebGL');
          assert.ok(appSource.includes('WebGLRenderingContext'), 'the WebGL capability check must remain enabled');
          assert.ok(performanceSource.includes('__ENTANGLED_PERF__'), 'performance profile should be visible for automated smoke checks');
          assert.ok(performanceSource.includes('build: "low-end-r12"'), 'deployment profile marker should be present for live browser verification');
          assert.ok(performanceSource.includes('maxDevicePixelRatio,'), 'adaptive DPR cap must be exposed in the performance profile');
          assert.ok(performanceSource.includes('getTargetFrameRate'), 'reduced-motion and adaptive frame caps should remain enabled');
          assert.ok(performanceSource.includes('LOW_RESOURCE_PARTICLES = 16_384') && performanceSource.includes('STANDARD_PARTICLES = 32_768'), 'hardware-aware particle caps should remain enabled');
          assert.ok(performanceSource.includes('window.__ENTANGLED_PERF_PARTICLES__ = particleCount'), 'adaptive particle budget must be available before renderer import');
          assert.ok(performanceSource.includes('"__ENTANGLED_RENDER_SCALE__"'), 'internal DPR scale should not override the browser native devicePixelRatio');
          assert.ok(performanceSource.includes('MAX_RENDER_PIXELS = 1_000_000'), 'render-pixel budget must stay capped at one megapixel');
          assert.ok(performanceSource.includes('renderPixelBudget: MAX_RENDER_PIXELS'), 'render-pixel budget should remain enabled');
          assert.ok(appSource.includes('await import("./bundle.min.js")'), 'bundle should load only through the WebGL-aware module loader');
          assert.ok(appSource.includes('await import("./three.r157.min.js")'), 'Three.js must load only after WebGL capability check');
          assert.ok(appSource.includes('loadClassicScript("./fxhash.min.js")'), 'fxhash runtime must load only after WebGL capability check');
          assert.ok(appSource.includes('MutationObserver'), 'canvas recovery and accessibility setup should use a DOM observer');
          assert.ok(appSource.includes('webglcontextlost'), 'WebGL context loss should trigger the lightweight fallback');
          for (const runtime of ['three.r157.min.js', 'fxhash.min.js', 'bundle.min.js']) {
            assert.ok(existsSync(runtime), `runtime asset must exist: ${runtime}`);
          }
          assert.ok(performanceSource.includes('pointerControls: false'), 'pointer/touch interaction should remain disabled');
          assert.ok(performanceSource.includes('keyboardShortcuts: false'), 'keyboard shortcuts should remain disabled');
          const optimizedBundle = readFileSync('bundle.min.js', 'utf8');
          assert.ok(optimizedBundle.includes('Tn=Je.__ENTANGLED_RENDER_SCALE__||(Je.devicePixelRatio?Je.devicePixelRatio:1)'), 'renderer must use the capped internal DPR scale');
          assert.ok(optimizedBundle.includes('function na(){Tn=Je.__ENTANGLED_RENDER_SCALE__||(Je.devicePixelRatio?Je.devicePixelRatio:1);Cn&&Cn.setPixelRatio(Tn)'), 'renderer DPR must recalculate on resize');
          assert.ok(optimizedBundle.includes('Ht=!0,Tt.id=0==V?1:-1,Tt.visibility=0==V?1:0,Tt.visibilityTarget=0==V?1:0'), 'single-window mode must initialize exactly one visible renderer instance');
          assert.ok(optimizedBundle.includes('Tt.resolvedIteration=D.resolved()'), 'single-window instance must receive the current resolved iteration');
          assert.ok(optimizedBundle.includes('$t=1'), 'standalone visual must have a valid single top-window identifier');
          assert.ok(optimizedBundle.includes('Ht&&(s=r,l=i)'), 'single-window mode must size the canvas to the viewport rather than the physical display');
          assert.ok(optimizedBundle.includes('"complete"===document.readyState&&"hidden"!=document.visibilityState&&Bt()'), 'dynamically imported bundle must initialize even if page load already fired');
          assert.ok(optimizedBundle.includes('ut=Je.__ENTANGLED_PERF_PARTICLES__||32768'), 'GPU particle count must follow the adaptive hardware profile');
          assert.ok(optimizedBundle.includes('new Ye.WebGLRenderer({antialias:!1,depthBuffer:!0,alpha:ht<1,powerPreference:"low-power"})'), 'renderer should request low-power GPU mode without MSAA');
          assert.ok(!optimizedBundle.includes('console.log("today:"'), 'startup diagnostic logging should be absent');
          assert.ok(!optimizedBundle.includes('DETAILED FEATURES'), 'feature-dump logging should be absent');
          assert.ok(!optimizedBundle.includes('ut=15e5'), 'original 1.5-million particle workload must not return');
          assert.ok(!optimizedBundle.includes('Tn<=1'), 'the old low-DPI render-size doubling path must stay removed');
          for (const input of ['window.addEventListener("touchstart"', 'window.addEventListener("mousedown"', 'window.addEventListener("mousemove"', 'window.addEventListener("wheel"', 'document.addEventListener("keydown"']) {
            assert.ok(!optimizedBundle.includes(input), `non-visual event handler must stay removed: ${input}`);
          }
          assert.ok(!existsSync('favicon.svg'), 'custom non-original favicon should be removed from the repository');
          const config = readFileSync('_config.yml', 'utf8');
          for (const excluded of ['.github', 'original-source', 'README.md', 'ORIGINAL_SOURCE_AUDIT.md', 'THIRD_PARTY_NOTICES.md']) {
            assert.ok(config.includes(excluded), `non-page content should be excluded from the published site: ${excluded}`);
          }
          console.log('PASS page wiring, local asset references, obsolete-file cleanup, and footer links');
          NODE
