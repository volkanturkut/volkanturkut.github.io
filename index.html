<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Volkan Turkut — art, games, and code.">
  <title>Volkan Turkut</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
:root{color-scheme:dark;--bg:#000;--fg:#e8e9e6;--muted:#858681}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;background:var(--bg);color:var(--fg);font-family:Inter,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.stage{position:relative;width:100%;height:100vh;height:100svh;min-height:320px;overflow:hidden;background:#000;isolation:isolate}
#orb{position:absolute;inset:0;display:block;width:100%;height:100%;z-index:1}
.footer{position:absolute;z-index:4;inset-inline:0;bottom:clamp(25px,4.6vh,46px);display:flex;flex-direction:column;align-items:center;gap:13px;padding-inline:20px;text-align:center;pointer-events:none}
.creator{margin:0;color:rgba(236,237,233,.9);font-size:10px;font-weight:500;letter-spacing:.19em;line-height:1.4;text-transform:uppercase}
.links{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:9px 21px;margin:0;padding:0;list-style:none;pointer-events:auto}
.links a{color:var(--muted);font-size:11px;letter-spacing:.015em;text-decoration:none;transition:color 180ms ease;outline-offset:5px}
.links a:hover,.links a:focus-visible{color:var(--fg)}
.links a:focus-visible{outline:1px solid rgba(236,237,233,.6)}
@media(max-width:560px){.footer{bottom:max(22px,env(safe-area-inset-bottom));gap:12px}.links{gap:10px 17px}.links a{font-size:10px}}
@media(prefers-reduced-motion:reduce){.links a{transition:none}}
</style>
</head>
<body>
  <main class="stage" aria-label="Generative particle artwork">
    <canvas id="orb" aria-hidden="true"></canvas>
    <footer class="footer">
      <p class="creator">Volkan Turkut</p>
      <nav aria-label="Social links">
        <ul class="links">
          <li><a href="https://volkanturkut.artstation.com/" target="_blank" rel="noopener noreferrer">ArtStation</a></li>
          <li><a href="https://volkanturkut.itch.io/" target="_blank" rel="noopener noreferrer">itch.io</a></li>
          <li><a href="https://github.com/volkanturkut" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        </ul>
      </nav>
    </footer>
  </main>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("orb");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const storeKey = "volkan-entangled-windows-v2";
  const id = (Date.now().toString(36) + Math.random().toString(36).slice(2, 11));
  const born = Date.now();
  let width = innerWidth, height = innerHeight, dpr = 1;
  let mouseX = 0, mouseY = 0, frame = 0, startTime = 0, lastTime = 0;
  let peers = [], lastStorageWrite = 0, lastShape = "";
  let storageAvailable = true;

  function ownWindow() {
    return { id, x: Number(window.screenX || 0), y: Number(window.screenY || 0),
      w: innerWidth, h: innerHeight, t: Date.now(), created: born };
  }

  function readRows() {
    try {
      const value = JSON.parse(localStorage.getItem(storeKey) || "[]");
      return Array.isArray(value) ? value : [];
    } catch (_) {
      storageAvailable = false;
      return [];
    }
  }

  function refreshPeers() {
    const now = Date.now();
    const rows = readRows().filter(p => p && p.id && now - Number(p.t || 0) < 6500);
    const mine = ownWindow();
    if (!rows.some(p => p.id === id)) rows.push(mine);
    peers = rows.sort((a, b) => Number(a.created || 0) - Number(b.created || 0)).slice(0, 8);
  }

  function syncWindows(force) {
    const now = Date.now();
    const mine = ownWindow();
    const rows = readRows().filter(p => p && p.id && p.id !== id && now - Number(p.t || 0) < 6500);
    const shape = [mine.x, mine.y, mine.w, mine.h].join(",");
    if (storageAvailable && (force || shape !== lastShape || now - lastStorageWrite > 1250)) {
      try {
        localStorage.setItem(storeKey, JSON.stringify(rows.concat([mine])));
        lastStorageWrite = now;
        lastShape = shape;
      } catch (_) { storageAvailable = false; }
    }
    peers = rows.concat([mine]).sort((a, b) => Number(a.created || 0) - Number(b.created || 0)).slice(0, 8);
  }

  function cleanupWindow() {
    if (!storageAvailable) return;
    try {
      const rows = readRows().filter(p => p && p.id && p.id !== id && Date.now() - Number(p.t || 0) < 6500);
      localStorage.setItem(storeKey, JSON.stringify(rows));
    } catch (_) {}
  }

  syncWindows(true);
  addEventListener("storage", event => { if (!event.key || event.key === storeKey) refreshPeers(); });
  const heartbeat = setInterval(() => syncWindows(false), 250);
  addEventListener("pagehide", () => { clearInterval(heartbeat); if (frame) cancelAnimationFrame(frame); cleanupWindow(); }, { once: true });

  function fallback() {
    const fallbackCanvas = document.createElement("canvas");
    fallbackCanvas.id = "orb";
    fallbackCanvas.setAttribute("aria-hidden", "true");
    canvas.replaceWith(fallbackCanvas);
    const ctx = fallbackCanvas.getContext("2d");
    if (!ctx) return;
    let points = [], fallbackFrame = 0;
    function seed() {
      const n = Math.min(18000, Math.max(6000, Math.floor(innerWidth * innerHeight / 70)));
      points = [];
      for (let i = 0; i < n; i++) {
        const z = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r0 = Math.random();
        const r = r0 < .65 ? .72 + Math.random() * .28 : r0 < .9 ? .38 + Math.random() * .36 : Math.random() * .46;
        const s = Math.sqrt(1 - z * z);
        points.push({ x: Math.cos(a) * s * r, y: z * r, z: Math.sin(a) * s * r,
          a: Math.random() * .35 + .03, p: Math.random() * Math.PI * 2 });
      }
    }
    function draw(now) {
      width = innerWidth; height = innerHeight; dpr = Math.min(devicePixelRatio || 1, 1.25);
      fallbackCanvas.width = Math.max(1, Math.floor(width * dpr));
      fallbackCanvas.height = Math.max(1, Math.floor(height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, width, height);
      const t = reduceMotion ? 0 : now * .00015, radius = Math.min(width, height) * .4;
      for (const p of points) {
        const ca = Math.cos(t + p.p * .05), sa = Math.sin(t + p.p * .05);
        const x = p.x * ca - p.z * sa, z = p.x * sa + p.z * ca;
        const y = p.y * Math.cos(.13 + mouseY * .05) - z * Math.sin(.13 + mouseY * .05);
        const screenX = width * .5 + x * radius, screenY = height * .46 + y * radius;
        ctx.fillStyle = "rgba(54,255,120," + (p.a * (.35 + (z + 1) * .22)) + ")";
        ctx.fillRect(screenX, screenY, .8, .8);
      }
      if (!reduceMotion) fallbackFrame = requestAnimationFrame(draw);
    }
    function reset() {
      if (fallbackFrame) cancelAnimationFrame(fallbackFrame);
      seed(); draw(0);
    }
    reset();
    addEventListener("resize", reset, { passive: true });
    addEventListener("pointermove", e => {
      mouseX = e.clientX / Math.max(1, innerWidth) - .5;
      mouseY = e.clientY / Math.max(1, innerHeight) - .5;
    }, { passive: true });
  }

  const gl = canvas.getContext("webgl2", { alpha: false, antialias: false, powerPreference: "high-performance" });
  if (!gl || !gl.getExtension("EXT_color_buffer_float")) { fallback(); return; }

  const quadVS = "#version 300 es\nin vec2 aPosition;out vec2 vUv;void main(){vUv=aPosition*.5+.5;gl_Position=vec4(aPosition,0.,1.);}";
  const copyFS = "#version 300 es\nprecision highp float;in vec2 vUv;uniform sampler2D uTexture;uniform float uFade;out vec4 outColor;void main(){outColor=vec4(texture(uTexture,vUv).rgb*uFade,1.);}";
  const computeFS = "#version 300 es\nprecision highp float;in vec2 vUv;uniform sampler2D uState;uniform float uTime;uniform float uDelta;out vec4 outColor;vec3 field(vec3 p,float t){return vec3(sin(p.y*2.11+p.z*.83+t*.17)+.38*cos(p.z*3.17-p.y*1.43-t*.09),sin(p.z*1.91+p.x*.73-t*.13)+.34*cos(p.x*3.41-p.z*2.17-t*.11),sin(p.x*1.73+p.y*.91+t*.12)+.39*cos(p.y*3.79-p.x*2.51+t*.16));}vec3 curlField(vec3 p,float t){float e=.022;vec3 dx=(field(p+vec3(e,0.,0.),t)-field(p-vec3(e,0.,0.),t))/(2.*e);vec3 dy=(field(p+vec3(0.,e,0.),t)-field(p-vec3(0.,e,0.),t))/(2.*e);vec3 dz=(field(p+vec3(0.,0.,e),t)-field(p-vec3(0.,0.,e),t))/(2.*e);return vec3(dy.z-dz.y,dz.x-dx.z,dx.y-dy.x);}void main(){vec4 s=texture(uState,vUv);vec3 p=s.xyz;float goal=s.a;vec3 radial=normalize(p+vec3(.00001));float r=length(p);vec3 flow=curlField(p*2.7+vec3(.31*sin(uTime*.07),uTime*.025,-uTime*.018),uTime*.31);flow+=curlField(p*4.9+vec3(3.1,1.7,2.4),-uTime*.19)*.24;flow-=radial*dot(flow,radial)*.37;vec3 v=flow*.105+radial*(goal-r)*1.65;p+=v*uDelta;p+=radial*(goal-length(p))*.018*uDelta;float nr=length(p);if(nr>1.12)p=normalize(p)*(1.12-(nr-1.12)*.25);outColor=vec4(p,goal);}";
  const particleVS = "#version 300 es\nprecision highp float;in vec2 aUv;in float aSeed;uniform sampler2D uState;uniform vec2 uResolution;uniform vec2 uCenter;uniform float uScale;uniform float uTime;uniform float uPixelRatio;uniform vec2 uMouse;uniform float uPhase;uniform vec3 uColor;out float vAlpha;out vec3 vColor;void main(){vec4 s=texture(uState,aUv);vec3 p=s.xyz;float yaw=uTime*.028+uPhase+uMouse.x*.09;float pitch=.11+uMouse.y*.08+sin(uTime*.13+uPhase)*.025;float cy=cos(yaw),sy=sin(yaw);vec3 q=vec3(p.x*cy+p.z*sy,p.y,-p.x*sy+p.z*cy);float cp=cos(pitch),sp=sin(pitch);q=vec3(q.x,q.y*cp-q.z*sp,q.y*sp+q.z*cp);float roll=.035*sin(uTime*.09+uPhase);q=vec3(q.x*cos(roll)-q.y*sin(roll),q.x*sin(roll)+q.y*cos(roll),q.z);vec2 px=uCenter+q.xy*uScale;vec2 ndc=vec2(px.x/uResolution.x*2.-1.,1.-px.y/uResolution.y*2.);gl_Position=vec4(ndc,q.z*.15,1.);gl_PointSize=(.45+pow(aSeed,1.7)*1.25)*uPixelRatio;float front=clamp(.72+q.z*.19,.28,.98);vAlpha=(.0018+pow(aSeed,2.1)*.025)*front*(.72+s.a*.28);vColor=uColor*(.48+pow(aSeed,1.45)*1.35);}";
  const particleFS = "#version 300 es\nprecision highp float;in float vAlpha;in vec3 vColor;out vec4 outColor;void main(){vec2 p=gl_PointCoord-.5;float a=vAlpha*exp(-dot(p,p)*17.);if(a<.001)discard;outColor=vec4(vColor*a,a);}";
  const tetherVS = "#version 300 es\nprecision highp float;in float aT;in float aSeed;uniform vec2 uResolution;uniform vec2 uA;uniform vec2 uB;uniform float uTime;uniform float uPixelRatio;uniform float uAmplitude;uniform vec3 uColorA;uniform vec3 uColorB;out float vAlpha;out vec3 vColor;void main(){float t=aT;vec2 delta=uB-uA;float len=max(1.,length(delta));vec2 normal=vec2(-delta.y,delta.x)/len;float envelope=pow(max(0.,sin(3.14159265*t)),.55);float w1=sin(t*23.+uTime*.68+aSeed*8.1)*uAmplitude;float w2=sin(t*41.-uTime*.42+aSeed*19.)*uAmplitude*.29;float drift=(aSeed-.5)*uAmplitude*.9;vec2 px=mix(uA,uB,t)+normal*(w1+w2+drift)*envelope;float z=sin(t*17.+uTime*.6+aSeed*11.)*.08;vec2 ndc=vec2(px.x/uResolution.x*2.-1.,1.-px.y/uResolution.y*2.);gl_Position=vec4(ndc,z,1.);gl_PointSize=(.25+aSeed*1.05)*uPixelRatio;vAlpha=(.004+aSeed*.027)*envelope;vColor=mix(uColorA,uColorB,t)*(.5+aSeed*1.1);}";
  const tetherFS = "#version 300 es\nprecision highp float;in float vAlpha;in vec3 vColor;out vec4 outColor;void main(){vec2 p=gl_PointCoord-.5;float a=vAlpha*exp(-dot(p,p)*13.);if(a<.001)discard;outColor=vec4(vColor*a,a);}";

  function compile(type, source) {
    const s = gl.createShader(type);
    gl.shaderSource(s, source); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  function makeProgram(vsrc, fsrc) {
    const vs = compile(gl.VERTEX_SHADER, vsrc), fs = compile(gl.FRAGMENT_SHADER, fsrc);
    if (!vs || !fs) return null;
    const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return null; }
    return p;
  }
  const copyProgram = makeProgram(quadVS, copyFS);
  const computeProgram = makeProgram(quadVS, computeFS);
  const particleProgram = makeProgram(particleVS, particleFS);
  const tetherProgram = makeProgram(tetherVS, tetherFS);
  if (!copyProgram || !computeProgram || !particleProgram || !tetherProgram) { fallback(); return; }

  const quadBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
  function bindQuad(program) {
    const a = gl.getAttribLocation(program, "aPosition");
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuffer);
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  }

  const stateSize = Math.min(512, Math.max(256, Math.min(innerWidth, innerHeight) < 620 ? 320 : 512));
  const particleCount = stateSize * stateSize;
  const initial = new Float32Array(particleCount * 4);
  const uvData = new Float32Array(particleCount * 2);
  const seeds = new Float32Array(particleCount);
  for (let y = 0; y < stateSize; y++) {
    for (let x = 0; x < stateSize; x++) {
      const i = y * stateSize + x;
      const z = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.random();
      const shell = r < .65 ? .72 + Math.random() * .28 : r < .9 ? .38 + Math.random() * .36 : .08 + Math.random() * .40;
      const planar = Math.sqrt(1 - z * z);
      const radius = shell;
      initial.set([Math.cos(a) * planar * radius, z * radius, Math.sin(a) * planar * radius, radius], i * 4);
      uvData.set([(x + .5) / stateSize, (y + .5) / stateSize], i * 2);
      seeds[i] = Math.random();
    }
  }

  function stateTarget(data) {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, stateSize, stateSize, 0, gl.RGBA, gl.FLOAT, data || null);
    const framebuffer = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error("Float particle target is incomplete");
    return { texture, framebuffer };
  }
  function trailTarget() {
    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, canvas.width, canvas.height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const framebuffer = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
    gl.drawBuffers([gl.COLOR_ATTACHMENT0]);
    return { texture, framebuffer };
  }
  let stateA = stateTarget(initial), stateB = stateTarget(null), trailA = null, trailB = null;

  const uvBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer); gl.bufferData(gl.ARRAY_BUFFER, uvData, gl.STATIC_DRAW);
  const seedBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, seedBuffer); gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);

  const tetherCount = 18000;
  const tetherT = new Float32Array(tetherCount), tetherSeeds = new Float32Array(tetherCount);
  for (let i = 0; i < tetherCount; i++) { tetherT[i] = Math.random(); tetherSeeds[i] = Math.random(); }
  const tetherTBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, tetherTBuffer); gl.bufferData(gl.ARRAY_BUFFER, tetherT, gl.STATIC_DRAW);
  const tetherSeedBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, tetherSeedBuffer); gl.bufferData(gl.ARRAY_BUFFER, tetherSeeds, gl.STATIC_DRAW);

  function bindTexture(program, name, texture) {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.uniform1i(gl.getUniformLocation(program, name), 0);
  }
  function setColor(program, name, rgb) {
    gl.uniform3f(gl.getUniformLocation(program, name), rgb[0], rgb[1], rgb[2]);
  }
  function colorFor(i) {
    if (i === 0) return [0.045, 1, 0.28];
    if (i === 1) return [1, 0.055, 0.17];
    if (i === 2) return [0.18, 0.42, 1];
    const colors = [[1,.38,.08],[.65,.22,1],[.05,.85,1],[1,.74,.1]];
    return colors[(i - 3) % colors.length];
  }
  function resize() {
    width = innerWidth; height = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 1.35);
    canvas.width = Math.max(1, Math.floor(width * dpr));
    canvas.height = Math.max(1, Math.floor(height * dpr));
    if (trailA) {
      gl.deleteFramebuffer(trailA.framebuffer); gl.deleteTexture(trailA.texture);
      gl.deleteFramebuffer(trailB.framebuffer); gl.deleteTexture(trailB.texture);
    }
    trailA = trailTarget(); trailB = trailTarget();
    for (const t of [trailA, trailB]) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, t.framebuffer);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  function drawCloud(peer, index, time, selfX, selfY) {
    const cx = Number(peer.x) + Number(peer.w) * .5 - selfX;
    const cy = Number(peer.y) + Number(peer.h) * .5 - selfY;
    const radius = Math.min(Number(peer.w) || width, Number(peer.h) || height) * .405;
    if (cx < -radius * 1.2 || cx > width + radius * 1.2 || cy < -radius * 1.2 || cy > height + radius * 1.2) return null;
    const color = colorFor(index);
    gl.useProgram(particleProgram);
    bindTexture(particleProgram, "uState", stateA.texture);
    gl.uniform2f(gl.getUniformLocation(particleProgram, "uResolution"), canvas.width, canvas.height);
    gl.uniform2f(gl.getUniformLocation(particleProgram, "uCenter"), cx * dpr, cy * dpr);
    gl.uniform1f(gl.getUniformLocation(particleProgram, "uScale"), radius * dpr);
    gl.uniform1f(gl.getUniformLocation(particleProgram, "uTime"), time);
    gl.uniform1f(gl.getUniformLocation(particleProgram, "uPixelRatio"), dpr);
    gl.uniform2f(gl.getUniformLocation(particleProgram, "uMouse"), mouseX, mouseY);
    gl.uniform1f(gl.getUniformLocation(particleProgram, "uPhase"), index * 1.83);
    setColor(particleProgram, "uColor", color);
    let a = gl.getAttribLocation(particleProgram, "aUv");
    gl.bindBuffer(gl.ARRAY_BUFFER, uvBuffer); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
    a = gl.getAttribLocation(particleProgram, "aSeed");
    gl.bindBuffer(gl.ARRAY_BUFFER, seedBuffer); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 1, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, particleCount);
    return { x: cx, y: cy, radius, color, index };
  }

  function drawTether(a, b, time) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 30 || dist > Math.max(width, height) * 2.6) return;
    const minX = Math.min(a.x, b.x), maxX = Math.max(a.x, b.x);
    const minY = Math.min(a.y, b.y), maxY = Math.max(a.y, b.y);
    if (maxX < -100 || minX > width + 100 || maxY < -100 || minY > height + 100) return;
    gl.useProgram(tetherProgram);
    gl.uniform2f(gl.getUniformLocation(tetherProgram, "uResolution"), canvas.width, canvas.height);
    gl.uniform2f(gl.getUniformLocation(tetherProgram, "uA"), a.x * dpr, a.y * dpr);
    gl.uniform2f(gl.getUniformLocation(tetherProgram, "uB"), b.x * dpr, b.y * dpr);
    gl.uniform1f(gl.getUniformLocation(tetherProgram, "uTime"), time);
    gl.uniform1f(gl.getUniformLocation(tetherProgram, "uPixelRatio"), dpr);
    gl.uniform1f(gl.getUniformLocation(tetherProgram, "uAmplitude"), Math.min(92, dist * .13));
    setColor(tetherProgram, "uColorA", a.color);
    setColor(tetherProgram, "uColorB", b.color);
    let loc = gl.getAttribLocation(tetherProgram, "aT");
    gl.bindBuffer(gl.ARRAY_BUFFER, tetherTBuffer); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 1, gl.FLOAT, false, 0, 0);
    loc = gl.getAttribLocation(tetherProgram, "aSeed");
    gl.bindBuffer(gl.ARRAY_BUFFER, tetherSeedBuffer); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 1, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.POINTS, 0, tetherCount);
  }

  function render(now) {
    if (!reduceMotion) frame = requestAnimationFrame(render);
    const elapsed = (now - (startTime || now)) * .001;
    if (!startTime) startTime = now;
    const time = reduceMotion ? 0 : elapsed;
    const dt = reduceMotion ? 0 : Math.min(.026, Math.max(.001, (now - (lastTime || now - 16)) * .001));
    lastTime = now;

    gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER, stateB.framebuffer);
    gl.viewport(0, 0, stateSize, stateSize);
    gl.useProgram(computeProgram);
    bindTexture(computeProgram, "uState", stateA.texture);
    gl.uniform1f(gl.getUniformLocation(computeProgram, "uTime"), time);
    gl.uniform1f(gl.getUniformLocation(computeProgram, "uDelta"), dt);
    bindQuad(computeProgram); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    const oldState = stateA; stateA = stateB; stateB = oldState;

    gl.bindFramebuffer(gl.FRAMEBUFFER, trailB.framebuffer);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.disable(gl.BLEND);
    gl.useProgram(copyProgram); bindTexture(copyProgram, "uTexture", trailA.texture);
    gl.uniform1f(gl.getUniformLocation(copyProgram, "uFade"), reduceMotion ? 0 : .977);
    bindQuad(copyProgram); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    const mine = ownWindow(), selfX = mine.x, selfY = mine.y;
    const visible = [];
    const orderedPeers = peers.length ? peers : [mine];
    for (let i = 0; i < orderedPeers.length; i++) {
      const p = orderedPeers[i];
      const centerX = Number(p.x) + Number(p.w) * .5 - selfX;
      const centerY = Number(p.y) + Number(p.h) * .5 - selfY;
      const radius = Math.min(Number(p.w) || width, Number(p.h) || height) * .405;
      if (centerX >= -radius * 1.2 && centerX <= width + radius * 1.2 && centerY >= -radius * 1.2 && centerY <= height + radius * 1.2) {
        const cloud = drawCloud(p, i, time, selfX, selfY);
        if (cloud) visible.push(cloud);
      }
    }
    for (let i = 0; i < orderedPeers.length; i++) {
      for (let j = i + 1; j < orderedPeers.length; j++) {
        const a = orderedPeers[i], b = orderedPeers[j];
        const ca = { x: Number(a.x) + Number(a.w) * .5 - selfX, y: Number(a.y) + Number(a.h) * .5 - selfY,
          color: colorFor(i), index: i };
        const cb = { x: Number(b.x) + Number(b.w) * .5 - selfX, y: Number(b.y) + Number(b.h) * .5 - selfY,
          color: colorFor(j), index: j };
        drawTether(ca, cb, time);
      }
    }
    gl.disable(gl.BLEND);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(copyProgram); bindTexture(copyProgram, "uTexture", trailB.texture);
    gl.uniform1f(gl.getUniformLocation(copyProgram, "uFade"), 1);
    bindQuad(copyProgram); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    const oldTrail = trailA; trailA = trailB; trailB = oldTrail;
  }

  addEventListener("pointermove", e => {
    mouseX = (e.clientX / Math.max(1, innerWidth) - .5) * 2;
    mouseY = (e.clientY / Math.max(1, innerHeight) - .5) * 2;
  }, { passive: true });
  addEventListener("pointerleave", () => { mouseX = 0; mouseY = 0; }, { passive: true });
  addEventListener("resize", () => { syncWindows(true); resize(); }, { passive: true });
  try { resize(); render(0); }
  catch (error) { console.error("Particle renderer fallback", error); fallback(); }
})();
</script>
</body>
</html>
